<!DOCTYPE html>
<html>

<head>
    <title>Arithmetic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="header">
            <h1>🧮 Arithmetic Calculator</h1>
            <p>Simple • Fast • Powerful</p>
        </div>

        <div class="input-group">

            <label for="number1">First Number</label>
            <input type="number" id="number1" step="any" placeholder="Enter first number">

        </div>


        <div class="input-group">

            <label for="number2">Second Number</label>
            <input type="number" id="number2" step="any" placeholder="Enter second number">

        </div>


        <div class="input-group">

            <label for="operation">Choose Operation</label>

            <select id="operation">
                <option value="add">Addition (+)</option>
                <option value="subtract">Subtraction (-)</option>
                <option value="multiply">Multiplication (×)</option>
                <option value="divide">Division (÷)</option>
            </select>

        </div>


        <div class="buttons">

            <button class="calculate-btn" onclick="calculate()">
                Calculate
            </button>

            <button class="clear-btn" onclick="clearCalculator()">
                Clear
            </button>

        </div>


        <div class="result-box">

            <p>Your Result</p>

            <h2 id="result">Result will appear here</h2>

        </div>


        <div class="footer">
            <p>Made with ❤️ while learning AI/ML</p>
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
